# Beat the Baseline: every frozen decision lives here.
# Anything marked LOCKED is copied into docs/PREREGISTRATION.md and must not change
# after the prereg tag (prereg-v1). Changing it later means a new, clearly labeled run.

project:
  name: earnings-move-forecasting
  seed: 2026                       # LOCKED. Used by LightGBM, bootstrap, audit sampling

universe:
  snapshot_date: "2026-10-09"      # LOCKED. Wikipedia S&P 500 list as of this Friday
  membership_file: data/raw/membership/sp500_historical_components.csv   # fja05680/sp500
  # One share class per CIK. LOCKED list of the class we keep (Yahoo format).
  share_class_keep: [GOOGL, FOXA, NWSA, BRK-B, BF-B]

data:
  prices_snapshot: "20261021"           # recorded after the full price download (folder name YYYYMMDD)
  edgar_snapshot: "20261021"             # same, for data/raw/edgar/

dates:
  edgar_start: "2017-01-01"        # history needed for the last-8 features
  prices_start: "2016-07-01"
  events_start: "2019-01-01"       # first report we score
  dev_folds_start: "2022-01-01"    # walk-forward test quarters 2022Q1..2024Q4
  dev_end: "2024-12-31"
  lockbox_start: "2025-01-01"      # LOCKED. Locked test set, opened once
  lockbox_end: "2026-09-30"

event:
  filing_forms: ["8-K"]            # LOCKED. 8-K/A amendments are excluded
  required_item: "2.02"            # LOCKED. Results of Operations and Financial Condition
  dedupe_days: 45                  # LOCKED. Item 2.02 filings within 45 days are one report window
  burst_days: 3                    # LOCKED. Filings within 3 days are one burst; its first filing stands for it
  market_open_et: "09:30"
  timing_plan: B                   # A or B, set by the timing hand check, then LOCKED (B, 2026-10-26)
  min_prior_events: 8              # LOCKED. Fewer than 8 completed prior reports = not scored (both predictors)

target:
  name: move_adj                   # LOCKED
  formula: "100 * abs(ln(P_after/P_before) - ln(SPY_after/SPY_before))"
  market_proxy: SPY                # adjusted closes, same window as the stock

features:                          # LOCKED. Nothing else goes into the model
  - hist_median8
  - hist_mean8
  - hist_max8
  - hist_last
  - vol_21d
  - vol_63d
  - ret_21d
  - absret_21d
  - vix

model:
  type: lightgbm
  params:                          # LOCKED. Picked once, never tuned
    objective: l1                  # matches the MAE we score on
    learning_rate: 0.03
    n_estimators: 400
    num_leaves: 15
    min_child_samples: 50
    subsample: 1.0
    colsample_bytree: 1.0
    reg_lambda: 1.0
    deterministic: true
    force_row_wise: true
    n_jobs: 1
    verbose: -1

eval:
  loss: absolute_error             # LOCKED
  primary_stat: rel_mae_improvement   # 1 - MAE_model / MAE_baseline
  bootstrap:
    cluster: week                  # LOCKED. Resample whole report weeks
    n_resamples: 2000
    ci_level: 0.95
  success:
    min_point_improvement: 0.03    # LOCKED. At least 3% smaller MAE
    ci_lower_above: 0.0
  tripwire_improvement: 0.30       # above this: stop and hunt for a leak

live:
  drops:
    - id: drop1
      cutoff: "2026-10-16"
      post_by: "2026-10-19T21:00:00-07:00"
      window: ["2026-10-20", "2026-10-23"]
      note: "Not run. Kept for tests and the demo only; nothing from it is scored."
    - id: drop2
      cutoff: "2026-10-23"
      post_by: "2026-10-25T21:00:00-07:00"
      window: ["2026-10-26", "2026-10-30"]
      note: "Not run. Kept for reference only; nothing from it is scored."
    - id: drop2b
      cutoff: "2026-10-30"
      post_by: "2026-11-01T21:00:00-08:00"
      window: ["2026-11-02", "2026-11-06"]
    - id: drop3
      cutoff: "2026-11-13"
      post_by: "2026-11-16T21:00:00-08:00"
      window: ["2026-11-17", "2026-11-20"]
      note: "Extra demonstration drop; not part of the pre-registered live evaluation."
